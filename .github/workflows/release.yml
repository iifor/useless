name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - kind: macos
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
          - kind: windows
            os: windows-latest
            args: --target x86_64-pc-windows-msvc --bundles nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.kind == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'x86_64-pc-windows-msvc' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Validate tag and install dependencies
        shell: bash
        run: |
          node -e 'const p=require("./package.json"); if (`v${p.version}` !== process.env.GITHUB_REF_NAME) throw new Error(`tag/version mismatch: ${process.env.GITHUB_REF_NAME} != v${p.version}`)'
          pnpm install --frozen-lockfile

      - name: Validate release credentials
        shell: bash
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
        run: |
          test -n "$TAURI_UPDATER_PUBLIC_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          if [ "${{ matrix.kind }}" = "macos" ]; then
            test -n "$APPLE_CERTIFICATE"
            test -n "$APPLE_CERTIFICATE_PASSWORD"
            test -n "$APPLE_API_ISSUER"
            test -n "$APPLE_API_KEY"
            test -n "$APPLE_API_PRIVATE_KEY_BASE64"
            test -n "$APPLE_SIGNING_IDENTITY"
          else
            test -n "$AZURE_CLIENT_ID"
            test -n "$AZURE_CLIENT_SECRET"
            test -n "$AZURE_TENANT_ID"
            test -n "$AZURE_ENDPOINT"
            test -n "$AZURE_ACCOUNT"
            test -n "$AZURE_PROFILE"
          fi

      - name: Run project checks
        run: |
          pnpm test
          pnpm build
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Install Azure Artifact Signing CLI
        if: matrix.kind == 'windows'
        run: cargo install artifact-signing-cli --locked

      - name: Prepare Apple notarization key
        if: matrix.kind == 'macos'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | openssl base64 -d -A -out "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Generate release-only Tauri config
        shell: bash
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          WINDOWS_SIGN_COMMAND: ${{ matrix.kind == 'windows' && format('artifact-signing-cli -e {0} -a {1} -c {2} -d UNO %1', vars.AZURE_ARTIFACT_SIGNING_ENDPOINT, vars.AZURE_ARTIFACT_SIGNING_ACCOUNT, vars.AZURE_ARTIFACT_SIGNING_PROFILE) || '' }}
        run: node scripts/write-release-config.mjs

      - name: Build signed bundles and updater artifacts
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          args: ${{ matrix.args }} --config src-tauri/tauri.release.local.conf.json
          generateReleaseNotes: true
          prerelease: false
          releaseDraft: true
          releaseName: UNO v__VERSION__
          tagName: v__VERSION__
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true

      - name: Verify macOS bundle
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/UNO.app"
          dmg=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          codesign --verify --deep --strict --verbose=2 "$app"
          lipo -archs "$app/Contents/MacOS/black-shirt-companion" | grep -q 'x86_64 arm64\|arm64 x86_64'
          hdiutil verify "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type execute --verbose=2 "$app"

      - name: Verify Windows installer signature
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "Valid") { throw "Invalid Authenticode signature: $($signature.Status)" }

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and validate updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir release-check
          gh release download "$GITHUB_REF_NAME" --pattern latest.json --dir release-check
          node scripts/validate-updater-manifest.mjs release-check/latest.json "$GITHUB_REF_NAME"

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
