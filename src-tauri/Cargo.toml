[package]
name = "black-shirt-companion"
version = "0.1.0"
description = "安静慵懒的黑衣桌面伙伴"
authors = ["Black Shirt Companion"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5.2.6"
tempfile = "3"
tauri-plugin-dialog = "2"
